name: Publish signed source release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed version tag, for example v0.0.1
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: captcha-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify version, signed tag and release ancestry
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(beta|rc)\.[1-9][0-9]*)?$ ]]
          grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(beta|rc)\.[1-9][0-9]*)?$' VERSION
          test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
          object=$(git rev-parse --verify "refs/tags/$RELEASE_TAG")
          test "$(git cat-file -t "$object")" = tag
          test "$(gh api "repos/$GH_REPO/git/tags/$object" --jq '.verification.verified')" = true
          commit=$(git rev-parse "$object^{}")
          test "$(git rev-parse HEAD)" = "$commit"
          case "$RELEASE_TAG" in
            *-beta.*|*-rc.*) git merge-base --is-ancestor "$commit" origin/develop ;;
            *) git merge-base --is-ancestor "$commit" origin/main ;;
          esac
      - run: pip install -r requirements.txt
      - run: python tests/test_wrapper.py
      - run: bash -n scripts/prepare.sh
      - name: Publish core source only
        shell: bash
        run: |
          args=("$RELEASE_TAG" --verify-tag --title "MiyoHub Captcha $RELEASE_TAG" --generate-notes --notes 'CPU captcha service release. See the bilingual README for setup, model checksums, resource requirements and third-party terms. Dependencies are prepared locally; no container images or model weights are uploaded.')
          case "$RELEASE_TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "${args[@]}"
